name: Build Android APK (FINN AI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Release & Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Permissões de Execução no Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Gradle)
        run: |
          set -o pipefail
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_output.log

      - name: Publicar Release no GitHub com APK e Logs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%s)"
          FILES=()
          [ -f android/gradle_output.log ] && FILES+=(android/gradle_output.log)
          for f in $(find android/ -name "*.apk" 2>/dev/null); do
            FILES+=("$f")
          done
          
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release create "$TAG" "${FILES[@]}" --title "FINN AI App ($TAG)" --notes "Download do APK instalável e log do build"
          fi

      - name: Fazer Upload do APK e Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-apk
          path: |
            android/gradle_output.log
            android/app/build/outputs/apk/debug/*.apk
            android/**/*.apk
          retention-days: 30
