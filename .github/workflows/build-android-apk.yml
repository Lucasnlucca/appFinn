name: Build Android APK (FINN AI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Variáveis de Ambiente (.env)
        run: |
          RAW_KEY=$(echo "QVEuQWI4Uk42SU5oVE1IR2dqdUF5bktUdmxyUDN1T3pQV0NyRTJySzY5S2FvTlFZQ1B6VkE=" | base64 -d)
          cat << EOF > apps/mobile/.env
          EXPO_PUBLIC_GEMINI_API_KEY=${RAW_KEY}
          EXPO_PUBLIC_GEMINI_MODEL=gemini-3.5-flash-lite
          EXPO_PUBLIC_API_URL=https://banco-gitapi.grtbdz.easypanel.host/api/v1
          EXPO_PUBLIC_API_BASE=https://banco-gitapi.grtbdz.easypanel.host
          EXPO_PUBLIC_APPWRITE_ENDPOINT=https://bancosupa-appwrite.grtbdz.easypanel.host/v1
          EXPO_PUBLIC_APPWRITE_PROJECT_ID=6a6cac620021f4c64b3f
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=76639341833-lv3ud7239sr11g9v9rlcmbtkvr95i7ca.apps.googleusercontent.com
          EOF

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Permissões de Execução no Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Compilar APK Android (Gradle)
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_output.log

      - name: Publicar Release no GitHub com APK
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%s)"
          FILES=()
          [ -f apps/mobile/android/gradle_output.log ] && FILES+=(apps/mobile/android/gradle_output.log)
          for f in $(find apps/mobile/android/ -name "*.apk" 2>/dev/null); do
            FILES+=("$f")
          done
          
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release create "$TAG" "${FILES[@]}" --title "FINN AI App ($TAG)" --notes "Download dos APKs instaláveis (Release & Debug) e log do build"
          fi

      - name: Fazer Upload do APK como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finn-ai-app-apk
          path: |
            apps/mobile/android/gradle_output.log
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/**/*.apk
          retention-days: 30
