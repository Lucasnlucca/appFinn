name: Build Android APK (FINN AI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK Release & Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Permissões de Execução no Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --info > gradle_build.log 2>&1 || (cat gradle_build.log | tail -n 80 && exit 1)

      - name: Fazer Upload do Log em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-error-log
          path: android/gradle_build.log
          retention-days: 7

      - name: Fazer Upload do APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finn-ai-app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
