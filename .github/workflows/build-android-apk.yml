name: Build Android APK (FINN AI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK Recomendado React Native)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Gerar Projeto Android Nativo com Expo Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Permissões de Execução no Gradlew
        run: chmod +x apps/mobile/android/gradlew

      - name: Compilar APK Release (Gradle)
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle_output.log

      - name: Publicar Release no GitHub com APK
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.$(date +%s)"
          FILES=()
          [ -f apps/mobile/android/gradle_output.log ] && FILES+=(apps/mobile/android/gradle_output.log)
          for f in $(find apps/mobile/android/ -name "*.apk" 2>/dev/null); do
            FILES+=("$f")
          done
          
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release create "$TAG" "${FILES[@]}" --title "FINN AI App ($TAG)" --notes "Download do APK instalável e log do build"
          fi

      - name: Fazer Upload do APK como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finn-ai-app-apk
          path: |
            apps/mobile/android/gradle_output.log
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/**/*.apk
          retention-days: 30
