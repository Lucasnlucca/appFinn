name: Build Android APK (FINN AI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK Release & Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências do Monorepo
        run: npm ci

      - name: Permissões de Execução no Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android (Gradle)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Listar Arquivos APK Gerados
        run: |
          echo "=== ARQUIVOS APK ENCONTRADOS ==="
          ls -la android/app/build/outputs/apk/debug/ || find android/ -name "*.apk"

      - name: Fazer Upload do APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finn-ai-app-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/**/*.apk
          retention-days: 30
