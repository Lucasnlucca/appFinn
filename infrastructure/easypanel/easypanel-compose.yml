# EasyPanel Compose File para FINN AI (Hostinger VPS)
# Gerencia API, Web, PostgreSQL 16 e Redis 7 com SSL automático via Traefik integrado

version: '3.8'

services:
  # -------------------------------------------------------------
  # FINN AI - Backend API (NestJS)
  # -------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - CORS_ORIGINS=${APP_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PLUGGY_CLIENT_ID=${PLUGGY_CLIENT_ID}
      - PLUGGY_CLIENT_SECRET=${PLUGGY_CLIENT_SECRET}
      - PLUGGY_MODE=${PLUGGY_MODE:-personal}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # -------------------------------------------------------------
  # FINN AI - Frontend PWA (Next.js 14)
  # -------------------------------------------------------------
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${API_URL}/api/v1
    depends_on:
      - api
    networks:
      - finn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # -------------------------------------------------------------
  # Banco de Dados Relacional - PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-finn_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-finn_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finn_admin} -d ${POSTGRES_DB:-finn_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finn-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # -------------------------------------------------------------
  # Cache & Filas Assíncronas - Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finn-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
    name: finn_postgres_data
  redis_data:
    name: finn_redis_data

networks:
  finn-network:
    name: finn_app_network
    driver: bridge

