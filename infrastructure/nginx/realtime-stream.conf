# =============================================================================
# FINN AI — Configuração de Proxy Reverso Nginx para Server-Sent Events (SSE)
# Garante entrega em tempo real sem buffering para PostgreSQL LISTEN / NOTIFY
# =============================================================================

location ~ ^/(api/v1/stream|api/stream|stream) {
    proxy_pass http://finn_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Obrigatório para SSE (Server-Sent Events) em tempo real sem atraso
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    tcp_nodelay on;
    keepalive_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    add_header X-Accel-Buffering "no" always;
    add_header Cache-Control "no-cache, no-transform" always;
}
